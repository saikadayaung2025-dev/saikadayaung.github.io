<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Pyidaungsu', sans-serif, Arial;
            text-align: center;
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .photo-frame {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .heart {
            font-size: 40px;
            animation: beat 0.8s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="photo-frame">
            <!-- ပုံထည့်ရန်နေရာ - your-photo.jpg နေရာတွင် ပုံနာမည် (သို့) ပုံလင့်ခ် ထည့်ပါ -->
            <img src="your-photo.jpg" alt="My Love">
        </div>
        
        <h1>ချစ်ရတဲ့ ကိုယ့်ရဲ့ The Only One ❤️</h1>
        <p>ဒီဝဘ်ဆိုက်လေးက ကိုယ့်ရဲ့ မေတ္တာတွေနဲ့ ဖန်တီးထားတာပါ။ အမြဲတမ်း ပျော်ရွှင်ရပါစေခင်ဗျာ...</p>
        
        <div class="heart">❤️</div>
    </div>

</body>
</html>
